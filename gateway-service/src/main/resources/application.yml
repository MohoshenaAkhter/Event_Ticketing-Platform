server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: event-service
              uri: http://event-service:8083
              predicates:
                - Path=/events/**

            - id: venue-service
              uri: http://venue-service:8084
              predicates:
                - Path=/venues/**